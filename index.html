<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">

<title>DeBuG Panel</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    font-family:"Vazirmatn",sans-serif;
    color:#fff;
    background:
        radial-gradient(circle at 50% 28%,rgba(255,40,0,.14),transparent 28%),
        radial-gradient(circle at 50% 80%,rgba(255,0,0,.10),transparent 35%),
        #020202;
}

/* =========================
   BACKGROUND
========================= */

.bg{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
}

.bg::before{
    content:"";
    position:absolute;
    width:700px;
    height:700px;
    left:50%;
    top:80px;
    transform:translateX(-50%);
    border-radius:50%;
    border:1px solid rgba(255,50,20,.18);
    box-shadow:
        0 0 40px rgba(255,0,0,.08),
        inset 0 0 40px rgba(255,60,0,.04);
}

.bg::after{
    content:"";
    position:absolute;
    width:520px;
    height:520px;
    left:50%;
    top:170px;
    transform:translateX(-50%);
    border-radius:50%;
    border:1px solid rgba(255,120,20,.12);
    animation:pulseRing 4s ease-in-out infinite;
}

@keyframes pulseRing{
    0%,100%{
        transform:translateX(-50%) scale(.96);
        opacity:.45;
    }
    50%{
        transform:translateX(-50%) scale(1.04);
        opacity:1;
    }
}

/* glowing particles */

.particle{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#ff3218;
    box-shadow:0 0 12px #ff3218;
    animation:floatParticle linear infinite;
}

.p1{left:12%;top:22%;animation-duration:5s}
.p2{left:82%;top:18%;animation-duration:7s}
.p3{left:23%;top:65%;animation-duration:6s}
.p4{left:76%;top:70%;animation-duration:8s}
.p5{left:50%;top:12%;animation-duration:5.5s}
.p6{left:90%;top:52%;animation-duration:6.5s}
.p7{left:7%;top:48%;animation-duration:7.5s}

@keyframes floatParticle{
    0%{
        transform:translateY(20px);
        opacity:0;
    }
    20%{
        opacity:1;
    }
    80%{
        opacity:1;
    }
    100%{
        transform:translateY(-80px);
        opacity:0;
    }
}

/* =========================
   MAIN
========================= */

.page{
    position:relative;
    z-index:2;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:35px 18px;
}

/* =========================
   CONTAINER
========================= */

.login-wrap{
    width:100%;
    max-width:590px;
    text-align:center;
}

/* =========================
   LOGO
========================= */

.logo-area{
    position:relative;
    width:330px;
    height:245px;
    margin:0 auto -8px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.logo-ring{
    position:absolute;
    width:260px;
    height:260px;
    border-radius:50%;
    border:2px solid rgba(255,45,15,.55);
    box-shadow:
        0 0 15px rgba(255,30,0,.45),
        0 0 50px rgba(255,30,0,.18),
        inset 0 0 30px rgba(255,30,0,.08);
    animation:ringRotate 10s linear infinite;
}

.logo-ring::before{
    content:"";
    position:absolute;
    inset:-10px;
    border-radius:50%;
    border:1px solid rgba(255,130,20,.3);
}

.logo-ring::after{
    content:"";
    position:absolute;
    width:12px;
    height:12px;
    border-radius:50%;
    top:-6px;
    left:50%;
    background:#ff3215;
    box-shadow:
        0 0 12px #ff3215,
        0 0 30px #ff3215;
}

@keyframes ringRotate{
    to{
        transform:rotate(360deg);
    }
}

.logo{
    position:relative;
    z-index:3;
    width:205px;
    height:205px;
    object-fit:contain;
    filter:
        drop-shadow(0 0 12px rgba(255,30,0,.65))
        drop-shadow(0 0 35px rgba(255,30,0,.25));
    animation:logoFloat 4s ease-in-out infinite;
}

@keyframes logoFloat{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-5px);
    }
}

/* =========================
   BRAND
========================= */

.brand{
    margin-top:-15px;
    margin-bottom:25px;
}

.brand h1{
    font-size:30px;
    font-weight:900;
    letter-spacing:.5px;
    text-shadow:
        0 0 10px rgba(255,30,0,.55),
        0 0 30px rgba(255,30,0,.25);
}

.brand h1 span{
    color:#ff3218;
}

.brand p{
    margin-top:8px;
    color:rgba(255,255,255,.55);
    font-size:11px;
    letter-spacing:4px;
    direction:ltr;
}

/* =========================
   CARD
========================= */

.card{
    position:relative;
    width:100%;
    padding:30px 30px 25px;
    border-radius:24px;

    background:
        linear-gradient(
            145deg,
            rgba(35,10,8,.78),
            rgba(5,5,5,.94)
        );

    border:1px solid rgba(255,55,25,.55);

    box-shadow:
        0 0 0 1px rgba(255,30,0,.06),
        0 0 30px rgba(255,30,0,.16),
        0 25px 70px rgba(0,0,0,.75);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
}

.card::before{
    content:"";
    position:absolute;
    top:-1px;
    left:18%;
    right:18%;
    height:2px;
    background:linear-gradient(
        90deg,
        transparent,
        #ff3218,
        #ff9b19,
        #ff3218,
        transparent
    );
    box-shadow:0 0 15px #ff3218;
}

.card::after{
    content:"";
    position:absolute;
    inset:10px;
    border:1px solid rgba(255,255,255,.025);
    border-radius:18px;
    pointer-events:none;
}

/* =========================
   TITLE
========================= */

.card-title{
    position:relative;
    z-index:2;
    margin-bottom:7px;
    font-size:23px;
    font-weight:800;
}

.card-title span{
    color:#ff3218;
    text-shadow:0 0 12px rgba(255,40,15,.5);
}

.card-subtitle{
    position:relative;
    z-index:2;
    color:rgba(255,255,255,.48);
    font-size:12px;
    margin-bottom:25px;
}

/* =========================
   ERROR
========================= */

.error{
    position:relative;
    z-index:5;
    display:none;
    margin-bottom:15px;
    padding:11px 14px;
    border-radius:12px;
    color:#ffb4aa;
    background:rgba(255,30,15,.08);
    border:1px solid rgba(255,50,30,.35);
    font-size:12px;
}

.error.show{
    display:block;
}

/* =========================
   INPUT
========================= */

.field{
    position:relative;
    z-index:3;
    margin-bottom:15px;
    text-align:right;
}

.field label{
    display:block;
    margin-bottom:7px;
    color:rgba(255,255,255,.58);
    font-size:12px;
    font-weight:600;
}

.input-wrap{
    position:relative;
}

.input-wrap .icon{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    color:#ff4a2e;
    font-size:17px;
    pointer-events:none;
}

input{
    width:100%;
    height:53px;
    padding:0 45px 0 45px;

    border-radius:13px;
    border:1px solid rgba(255,255,255,.10);

    outline:none;
    background:
        linear-gradient(
            90deg,
            rgba(255,30,0,.025),
            rgba(255,255,255,.035)
        );

    color:#fff;
    font-family:inherit;
    font-size:13px;

    direction:ltr;
    text-align:left;

    transition:
        border-color .25s,
        box-shadow .25s,
        background .25s;
}

input::placeholder{
    color:rgba(255,255,255,.28);
}

input:focus{
    border-color:rgba(255,55,25,.75);
    background:rgba(255,30,0,.045);
    box-shadow:
        0 0 0 3px rgba(255,40,15,.07),
        0 0 20px rgba(255,30,0,.10);
}

.eye{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    border:none;
    background:none;
    color:rgba(255,255,255,.4);
    cursor:pointer;
    font-size:16px;
    width:auto;
    padding:0;
    margin:0;
}

.eye:hover{
    color:#ff4a2e;
}

/* =========================
   BUTTON
========================= */

.login-btn{
    position:relative;
    z-index:3;
    width:100%;
    height:54px;
    margin-top:5px;

    border:1px solid rgba(255,145,30,.75);
    border-radius:13px;

    background:
        linear-gradient(
            100deg,
            #b50900,
            #ff2410 48%,
            #ff7800
        );

    color:#fff;
    font-family:inherit;
    font-size:14px;
    font-weight:800;

    cursor:pointer;

    box-shadow:
        0 0 18px rgba(255,30,0,.35),
        inset 0 1px rgba(255,255,255,.25);

    transition:
        transform .2s,
        box-shadow .2s,
        filter .2s;
}

.login-btn:hover{
    transform:translateY(-2px);
    filter:brightness(1.12);
    box-shadow:
        0 0 25px rgba(255,40,10,.55),
        0 0 55px rgba(255,30,0,.18);
}

.login-btn:active{
    transform:translateY(0);
}

.login-btn:disabled{
    opacity:.55;
    cursor:not-allowed;
    transform:none;
}

/* =========================
   FOOTER CARD
========================= */

.secure{
    position:relative;
    z-index:3;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-top:22px;
    color:rgba(255,255,255,.4);
    font-size:11px;
}

.secure::before,
.secure::after{
    content:"";
    width:55px;
    height:1px;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.2)
    );
}

.secure::after{
    transform:rotate(180deg);
}

.bottom{
    position:relative;
    z-index:3;
    margin-top:18px;
    display:flex;
    justify-content:center;
    gap:20px;
    color:rgba(255,255,255,.3);
    font-size:10px;
}

.bottom span{
    direction:ltr;
}

.bottom .accent{
    color:#ff3b20;
}

/* =========================
   SETUP WARNING
========================= */

.warn{
    position:relative;
    z-index:3;
    margin-bottom:17px;
    padding:13px;
    border-radius:12px;
    color:#ffc08d;
    background:rgba(255,100,20,.07);
    border:1px solid rgba(255,110,20,.25);
    font-size:11px;
    line-height:1.9;
}

.warn code{
    padding:2px 6px;
    border-radius:5px;
    background:rgba(0,0,0,.4);
    color:#ff704d;
    direction:ltr;
}

/* =========================
   HIDDEN
========================= */

.hidden{
    display:none!important;
}

/* =========================
   ANIMATION
========================= */

.login-wrap{
    animation:pageIn 1s cubic-bezier(.16,1,.3,1) both;
}

@keyframes pageIn{
    from{
        opacity:0;
        transform:translateY(30px) scale(.97);
    }
    to{
        opacity:1;
        transform:none;
    }
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .page{
        padding:20px 14px;
    }

    .logo-area{
        width:270px;
        height:205px;
    }

    .logo-ring{
        width:220px;
        height:220px;
    }

    .logo{
        width:175px;
        height:175px;
    }

    .brand h1{
        font-size:25px;
    }

    .brand p{
        font-size:9px;
        letter-spacing:3px;
    }

    .card{
        padding:25px 18px 21px;
        border-radius:20px;
    }

    .card-title{
        font-size:20px;
    }

    input,
    .login-btn{
        height:51px;
    }
}

@media(max-height:720px){

    .page{
        align-items:flex-start;
        padding-top:15px;
        padding-bottom:20px;
    }

    .logo-area{
        height:160px;
    }

    .logo-ring{
        width:170px;
        height:170px;
    }

    .logo{
        width:140px;
        height:140px;
    }

    .brand{
        margin-bottom:15px;
    }
}
</style>
</head>

<body>

<div class="bg">
    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>
    <div class="particle p5"></div>
    <div class="particle p6"></div>
    <div class="particle p7"></div>
</div>

<main class="page">

<div class="login-wrap">

    <!-- LOGO -->
    <div class="logo-area">

        <div class="logo-ring"></div>

        <!--
        اگر عکس لوگو را در پوشه پروژه با نام debug.png گذاشتی:
        -->
        <img
            class="logo"
            src="debug.png"
            alt="DeBuG"
        >

    </div>

    <!-- BRAND -->
    <div class="brand">
        <h1>
            <span>DeBuG</span> PANEL
        </h1>

        <p>
            FASTER • STRONGER • SMARTER
        </p>
    </div>

    <!-- LOGIN CARD -->
    <section class="card">

        <h2 class="card-title">
            ورود به پنل <span>DeBuG</span>
        </h2>

        <p class="card-subtitle">
            برای ورود، اطلاعات خود را وارد کنید
        </p>

        <div id="errorBox" class="error"></div>

        <form id="loginForm">

            <div class="field">

                <label>
                    نام کاربری ادمین
                </label>

                <div class="input-wrap">

                    <span class="icon">♙</span>

                    <input
                        id="username"
                        type="text"
                        placeholder="نام کاربری"
                        autocomplete="username"
                    >

                </div>

            </div>

            <div class="field">

                <label>
                    رمز عبور
                </label>

                <div class="input-wrap">

                    <span class="icon">♙</span>

                    <input
                        id="password"
                        type="password"
                        placeholder="رمز عبور"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="eye"
                        onclick="togglePassword()"
                        id="eyeBtn"
                    >
                        ◉
                    </button>

                </div>

            </div>

            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                ورود به پنل
            </button>

        </form>

        <div class="secure">
            <span>♢</span>
            اتصال امن
        </div>

    </section>

    <div class="bottom">
        <span>PXPanel 13.10.0</span>
        <span>|</span>
        <span class="accent">DeBuG</span>
    </div>

</div>

</main>

<script>

/* =========================
   PASSWORD SHOW / HIDE
========================= */

function togglePassword(){

    const input =
        document.getElementById("password");

    const btn =
        document.getElementById("eyeBtn");

    if(input.type === "password"){

        input.type = "text";
        btn.textContent = "◉";

    }else{

        input.type = "password";
        btn.textContent = "◉";

    }
}


/* =========================
   LOGIN
========================= */

document
.getElementById("loginForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    const btn =
        document.getElementById("loginBtn");

    const error =
        document.getElementById("errorBox");

    error.classList.remove("show");

    btn.disabled = true;
    btn.textContent = "در حال ورود...";

    try{

        const response =
            await fetch("/api/login",{

                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:JSON.stringify({

                    username:username,
                    password:password

                })

            });

        if(!response.ok){

            const data =
                await response.json()
                .catch(()=>({}));

            throw new Error(
                data.detail ||
                "نام کاربری یا رمز عبور اشتباه است"
            );

        }

        window.location.href =
            "/dashboard";

    }catch(err){

        error.textContent =
            err.message ||
            "خطا در ورود به پنل";

        error.classList.add("show");

        btn.disabled = false;
        btn.textContent = "ورود به پنل";

    }

});

</script>

</body>
</html>
